<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintNGo Referral — Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E42313;
    --red-dark: #c51f11;
    --gold: #F5A623;
    --bg-dark: #0D0D0D;
    --bg-section: #141414;
    --bg-card: #1C1C1C;
    --bg-card2: #242424;
    --text-primary: #FFFFFF;
    --text-secondary: #A0A0A0;
    --text-muted: #666666;
    --border: #2A2A2A;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ── Language switch animation ── */
  [data-i18n] { transition: opacity 0.18s ease; }
  body.lang-switching [data-i18n] { opacity: 0; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 48px; height: 64px;
    background: rgba(13,13,13,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .nav-logo span { color: var(--red); }
  .nav-right { display: flex; align-items: center; gap: 12px; }

  /* Language toggle pill */
  .lang-toggle {
    display: flex; align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
    cursor: pointer;
    gap: 2px;
  }
  .lang-btn {
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px; font-weight: 600;
    border: none; cursor: pointer;
    background: transparent; color: var(--text-muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .lang-btn.active {
    background: var(--red);
    color: #fff;
  }

  .nav-cta {
    background: var(--red); color: #fff;
    padding: 8px 20px; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; border: none;
    transition: background 0.15s;
  }
  .nav-cta:hover { background: var(--red-dark); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    padding: 100px 24px 80px;
    position: relative; overflow: hidden;
  }
  .hero-bg-number {
    position: absolute;
    font-size: clamp(180px, 30vw, 380px);
    font-weight: 900;
    color: rgba(228,35,19,0.06);
    pointer-events: none; user-select: none;
    letter-spacing: -8px; line-height: 1;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(228,35,19,0.12);
    border: 1px solid rgba(228,35,19,0.3);
    color: #ff6b5b; font-size: 12px; font-weight: 600;
    padding: 5px 14px; border-radius: 100px;
    margin-bottom: 28px; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .hero-badge::before { content: '●'; font-size: 8px; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hero h1 {
    font-size: clamp(36px, 6vw, 80px);
    font-weight: 800; line-height: 1.1;
    letter-spacing: -2px; margin-bottom: 14px;
    position: relative;
  }
  .hero h1 .amount { color: var(--red); }
  .hero-desc {
    font-size: 16px; color: var(--text-muted);
    max-width: 500px; margin: 0 auto 40px;
    position: relative; line-height: 1.7;
  }
  .hero-desc em { color: var(--text-secondary); font-style: normal; }

  .hero-actions {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    position: relative;
  }
  .btn-primary {
    background: var(--red); color: #fff;
    padding: 16px 36px; border-radius: 8px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; border: none;
    transition: all 0.15s; letter-spacing: -0.3px;
  }
  .btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(228,35,19,0.35); }
  .btn-secondary {
    background: transparent; color: var(--text-secondary);
    padding: 16px 28px; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border);
    transition: all 0.15s;
  }
  .btn-secondary:hover { border-color: #444; color: #fff; }

  .hero-stats {
    display: flex; gap: 40px; margin-top: 60px; position: relative;
    border-top: 1px solid var(--border); padding-top: 32px;
    flex-wrap: wrap; justify-content: center;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -1px; }
  .stat-num span { color: var(--red); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── TICKER ── */
  .ticker-wrap {
    background: var(--bg-section);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 14px 0; overflow: hidden; position: relative;
  }
  .ticker-wrap::before, .ticker-wrap::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 80px; z-index: 2;
    pointer-events: none;
  }
  .ticker-wrap::before { left: 0; background: linear-gradient(to right, var(--bg-section), transparent); }
  .ticker-wrap::after  { right: 0; background: linear-gradient(to left,  var(--bg-section), transparent); }
  .ticker-track {
    display: flex; gap: 0;
    animation: ticker 40s linear infinite;
    width: max-content;
  }
  .ticker-track:hover { animation-play-state: paused; }
  @keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 32px; white-space: nowrap;
    font-size: 13px; color: var(--text-secondary);
    border-right: 1px solid var(--border);
  }
  .ticker-item .t-name  { color: #fff; font-weight: 600; }
  .ticker-item .t-money { color: var(--gold); font-weight: 700; }
  .ticker-item .t-time  { color: var(--text-muted); font-size: 11px; }

  /* ── SECTIONS ── */
  section { padding: 96px 24px; max-width: 1100px; margin: 0 auto; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--red); margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800; letter-spacing: -1.5px;
    line-height: 1.1; margin-bottom: 48px;
  }

  /* ── TIERS ── */
  .tiers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tier-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px 24px;
    text-align: center; position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .tier-card:hover { border-color: var(--red); transform: translateY(-4px); }
  .tier-card.featured {
    border-color: var(--red);
    background: linear-gradient(135deg, #1C1C1C 0%, #200f0f 100%);
  }
  .tier-card.featured::after {
    content: attr(data-badge);
    position: absolute; top: 14px; right: 14px;
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 100px; letter-spacing: 0.5px;
  }
  .tier-friend { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px; }
  .tier-amount {
    font-size: clamp(40px, 5vw, 64px); font-weight: 900;
    letter-spacing: -3px; line-height: 1; margin-bottom: 6px;
    opacity: 0; transition: opacity 0.5s;
  }
  .tier-card.featured .tier-amount { color: var(--red); }
  .tier-amount.visible { opacity: 1; }
  .tier-amount-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .tier-status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600;
    padding: 5px 14px; border-radius: 100px;
    background: rgba(255,255,255,0.05); color: var(--text-muted);
  }
  .tier-card.featured .tier-status { background: rgba(228,35,19,0.12); color: #ff8577; }
  .tiers-total { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
  .tiers-total strong { color: var(--gold); font-size: 18px; }

  /* ── HOW IT WORKS ── */
  .how-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .how-step { display: flex; flex-direction: column; gap: 16px; }
  .how-num {
    width: 40px; height: 40px; border: 1px solid var(--border);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--red);
  }
  .how-icon { font-size: 36px; margin-bottom: 4px; }
  .how-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .how-desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

  /* ── ACTIVITY ── */
  .activity-section { background: var(--bg-section); padding: 96px 0; }
  .activity-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  .activity-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .activity-feed { display: flex; flex-direction: column; gap: 12px; }
  .activity-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    transition: opacity 0.3s, transform 0.3s;
  }
  .activity-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-card2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .activity-text { flex: 1; min-width: 0; }
  .activity-main { font-size: 13px; font-weight: 500; }
  .activity-main .highlight { color: var(--gold); font-weight: 700; }
  .activity-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .activity-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: #22C55E; }
  .dot-gold  { background: var(--gold); }
  .dot-red   { background: var(--red); }

  .activity-counter {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 36px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .counter-item { display: flex; flex-direction: column; gap: 4px; }
  .counter-num { font-size: 44px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
  .counter-num.red  { color: var(--red); }
  .counter-num.gold { color: var(--gold); }
  .counter-num.green { color: #22C55E; }
  .counter-label { font-size: 14px; font-weight: 600; color: #fff; }
  .counter-sub   { font-size: 12px; color: var(--text-muted); }
  .counter-divider { height: 1px; background: var(--border); }

  /* ── PROOF WALL ── */
  .proof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .proof-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
    transition: border-color 0.15s;
  }
  .proof-card:hover { border-color: #444; }
  .proof-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .proof-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-card2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .proof-name     { font-size: 13px; font-weight: 600; }
  .proof-location { font-size: 11px; color: var(--text-muted); }
  .proof-amount   { font-size: 26px; font-weight: 900; letter-spacing: -1px; color: var(--gold); margin-bottom: 4px; }
  .proof-desc     { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  /* ── FINAL CTA ── */
  .final-cta-wrap { background: linear-gradient(135deg, #140808 0%, #0D0D0D 100%); border-top: 1px solid var(--border); }
  .final-cta { max-width: 700px; margin: 0 auto; padding: 100px 24px; text-align: center; }
  .final-cta .big-num { font-size: clamp(60px, 10vw, 120px); font-weight: 900; color: var(--red); letter-spacing: -4px; line-height: 1; margin-bottom: 8px; }
  .final-cta h2 { font-size: clamp(22px, 3vw, 36px); font-weight: 700; margin-bottom: 6px; letter-spacing: -1px; }
  .final-cta .sub { font-size: 15px; color: var(--text-muted); margin-bottom: 40px; }
  .final-cta .note { margin-top: 20px; font-size: 12px; color: var(--text-muted); }

  /* ── FOOTER ── */
  footer {
    padding: 32px 48px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
    font-size: 12px; color: var(--text-muted);
  }
  footer a { color: var(--text-muted); text-decoration: none; }
  footer a:hover { color: #fff; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav { padding: 0 16px; }
    .tiers-grid { grid-template-columns: 1fr; }
    .how-grid   { grid-template-columns: 1fr; }
    .activity-layout { grid-template-columns: 1fr; }
    .proof-grid { grid-template-columns: repeat(2, 1fr); }
    footer { flex-direction: column; text-align: center; }
    .hero-stats { gap: 24px; }
  }
</style>
</head>

<!-- NAV -->

// ════════════════════════════════════════
//  LANGUAGE ENGINE
// ════════════════════════════════════════
let currentLang = 'zh';
let actIdx = 0;

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;

  // Toggle button state
  document.getElementById('btnZh').classList.toggle('active', lang === 'zh');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;

  // Fade all i18n elements
  document.body.classList.add('lang-switching');
  setTimeout(() => {
    applyTranslations();
    rebuildDynamic();
    document.body.classList.remove('lang-switching');
  }, 180);
}

function applyTranslations() {
  const t = T[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
}

function rebuildDynamic() {
  buildTicker();
  buildActivity();
  buildProofWall();
}

// ════════════════════════════════════════
//  DYNAMIC COMPONENTS
// ════════════════════════════════════════
function buildTicker() {
  const track = document.getElementById('ticker');
  const data = TICKER_DATA[currentLang];
  const doubled = [...data, ...data];
  track.innerHTML = doubled.map(d => `
    <span class="ticker-item">
      <span>${d.icon}</span>
      <span class="t-name">${d.name}</span>
      <span>${d.action}</span>
      ${d.money ? `<span class="t-money">${d.money}</span>` : ''}
      <span class="t-time">${d.time}</span>
    </span>
  `).join('');
}

function buildActivity() {
  const feed = document.getElementById('activity-feed');
  const data = ACTIVITY_DATA[currentLang];
  feed.innerHTML = data.map((a, i) => activityCardHTML(a, i * 0.06)).join('');
}

function activityCardHTML(a, delay = 0) {
  return `
    <div class="activity-card" style="animation-delay:${delay}s">
      <div class="activity-avatar">${a.avatar}</div>
      <div class="activity-text">
        <div class="activity-main">
          <strong>${a.name}</strong>（${a.city}） ${a.main}
          ${a.money ? `<span class="highlight">${a.money}</span>` : ''}
        </div>
        <div class="activity-sub">${a.sub}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
        <div class="activity-dot ${a.dotClass}"></div>
        <div class="activity-time">${a.time}</div>
      </div>
    </div>`;
}

function buildProofWall() {
  const grid = document.getElementById('proof-grid');
  const data = PROOF_DATA[currentLang];
  grid.innerHTML = data.map(p => `
    <div class="proof-card">
      <div class="proof-top">
        <div class="proof-avatar">${p.avatar}</div>
        <div>
          <div class="proof-name">${p.name}</div>
          <div class="proof-location">${p.loc}</div>
        </div>
      </div>
      <div class="proof-amount">${p.amount}</div>
      <div class="proof-desc">${p.desc}</div>
    </div>
  `).join('');
}

// ════════════════════════════════════════
//  ANIMATIONS & LIVE UPDATES
// ════════════════════════════════════════
function animateTiers() {
  const cards = document.querySelectorAll('.tier-card');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.querySelector('.tier-amount').classList.add('visible');
    });
  }, { threshold: 0.3 });
  cards.forEach(c => observer.observe(c));
}

function liveCounter() {
  const el = document.getElementById('counter-referrers');
  let n = 2847;
  setInterval(() => {
    if (Math.random() > 0.65) {
      n++;
      el.textContent = n.toLocaleString();
    }
  }, 4000);
}

function rotateActivity() {
  setInterval(() => {
    const feed = document.getElementById('activity-feed');
    const cards = feed.querySelectorAll('.activity-card');
    if (!cards.length) return;

    const last = cards[cards.length - 1];
    last.style.opacity = '0';
    last.style.transform = 'translateX(16px)';
    setTimeout(() => {
      last.remove();
      const pool = NEW_ACTIVITY[currentLang];
      const a = pool[actIdx % pool.length];
      actIdx++;
      const div = document.createElement('div');
      div.className = 'activity-card';
      div.style.cssText = 'opacity:0;transform:translateX(-16px)';
      div.innerHTML = `
        <div class="activity-avatar">${a.avatar}</div>
        <div class="activity-text">
          <div class="activity-main"><strong>${a.name}</strong>（${a.city}） ${a.main} ${a.money ? `<span class="highlight">${a.money}</span>` : ''}</div>
          <div class="activity-sub">${a.sub}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
          <div class="activity-dot ${a.dotClass}"></div>
          <div class="activity-time">${a.time}</div>
        </div>`;
      feed.insertBefore(div, feed.firstChild);
      requestAnimationFrame(() => {
        div.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        div.style.opacity = '1';
        div.style.transform = 'translateX(0)';
      });
    }, 320);
  }, 5000);
}

applyTranslations();

rotateActivity();
