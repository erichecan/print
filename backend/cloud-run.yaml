# Cloud Run service configuration for backend
# Backend service definition for GCP Cloud Run
# 2026-03-05: 启用 Cloud SQL，DATABASE_URL 使用 Unix socket（见 docs/backup-restore.md）
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: print-main-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"  # ✅ FREE TIER: Scale to zero when idle
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/memory: "512Mi"  # ✅ FREE TIER: Minimum memory
        run.googleapis.com/cpu: "1"
        run.googleapis.com/cloudsql-instances: "PROJECT_ID:REGION:print1600"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: REGION-docker.pkg.dev/PROJECT_ID/ARTIFACT_REGISTRY/backend:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-url
              key: latest
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: latest
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret-key
              key: latest
        - name: FRONTEND_URL
          value: "https://print-main-frontend-651538279084.us-central1.run.app"
        - name: CORS_ORIGINS
          value: "https://print-main-frontend-651538279084.us-central1.run.app"
        # 线下订单等图片上传必须配置；Cloud Run 服务账号需对该 bucket 有写权限（如 Storage Object Admin）
        - name: GCP_IMAGE_BUCKET
          value: "print-482914-images"
        - name: GCP_IMAGE_BASE_URL
          value: "https://storage.googleapis.com/print-482914-images"
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"  # ✅ FREE TIER: Minimum memory
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
  traffic:
  - percent: 100
    latestRevision: true

