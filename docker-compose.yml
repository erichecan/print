## Compose stack for production-like deployment [2025-11-10 13:48:30]
version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suvernireplus}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432" # [2025-11-16 18:39:30] Expose Postgres to host for local tools
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile # [2025-11-10 23:55:03] 调整构建上下文以便复制根目录下的 Prisma schema
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/suvernireplus}
      DB_HOST: ${DB_HOST:-postgres} # [2025-11-15 23:08:36] Ensure Sequelize connects via service hostname
      DB_PORT: ${DB_PORT:-5432} # [2025-11-15 23:08:36] Keep port in sync with postgres service
      DB_NAME: ${DB_NAME:-suvernireplus} # [2025-11-15 23:08:36] Provide database name fallback
      DB_USER: ${DB_USER:-postgres} # [2025-11-15 23:08:36] Provide database user for Sequelize config
      DB_PASSWORD: ${DB_PASSWORD:-postgres} # [2025-11-15 23:08:36] Provide password for Sequelize config
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder} # [2025-11-16 18:22:30] Redacted default to avoid leaking secrets
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379} # [2025-11-14 06:28:00] 为 ioredis 提供容器内地址
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"
    networks:
      - app-net

  # [2025-11-14 06:28:00] Redis 缓存服务，供后台速率限制与会话使用
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge

