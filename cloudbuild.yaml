# Cloud Build configuration for GCP deployment
# Configured for multi-service deployment (backend + frontend)
steps:
  # Compute build metadata (SHA + UTC build time) for both build-time and runtime injection
# 修复：gcloud builds submit 的 source 通常不包含 .git，不能依赖 git rev-parse
  # 目标：确保 NEXT_PUBLIC_BUILD_SHA/TIME 100% 有值（且不为 unknown/dev），用于前端控制台与 /api/version
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'compute-build-meta'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 注意：Cloud Build 会对“美元符号+花括号”的文本模式做 substitution 预处理
        # 这里避免使用 bash 的参数展开语法（带花括号），改用 if 判断，防止触发 INVALID_ARGUMENT。
        set -eo pipefail
        # 优先级：git(若存在) -> SHORT_SHA/COMMIT_SHA(触发器) -> BUILD_ID -> 时间戳
        RAW_SHA=""
        if git rev-parse --short HEAD >/dev/null 2>&1; then
          RAW_SHA="$(git rev-parse --short HEAD | tr -d '\n' | tr -d '\r')"
        fi
        if [ -z "$$RAW_SHA" ]; then
          # 避免带花括号的变量文本触发 Cloud Build substitution 预处理
          if [ -n "$$SHORT_SHA" ]; then RAW_SHA="$$SHORT_SHA"; fi
          if [ -z "$$RAW_SHA" ] && [ -n "$$COMMIT_SHA" ]; then RAW_SHA="$$COMMIT_SHA"; fi
        fi
        if [ -z "$$RAW_SHA" ]; then
          if [ -n "$$BUILD_ID" ]; then RAW_SHA="$$BUILD_ID"; fi
        fi
        if [ -z "$$RAW_SHA" ]; then
          RAW_SHA="$(date -u +%Y%m%d%H%M%S)"
        fi
        # 规范化：仅保留字母数字，并截断为 12（next.config 会再截断到 7 展示）
        BUILD_SHA="$$(echo "$$RAW_SHA" | tr -cd '[:alnum:]' | cut -c1-12)"
        if [ -z "$$BUILD_SHA" ]; then
          BUILD_SHA="$(date -u +%Y%m%d%H%M%S)"
        fi
        BUILD_TIME="$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")"
        echo "BUILD_SHA=$$BUILD_SHA" > /workspace/build-meta.env
        echo "BUILD_TIME=$$BUILD_TIME" >> /workspace/build-meta.env
        echo "[build-meta] BUILD_SHA=$$BUILD_SHA BUILD_TIME=$$BUILD_TIME"
    waitFor: ['-']

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/backend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    waitFor: ['compute-build-meta']

  # Read Stripe publishable key from Secret Manager for build
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'read-stripe-key'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        STRIPE_KEY=$(gcloud secrets versions access latest --secret=stripe-publishable-key --project=${PROJECT_ID})
        echo "$$STRIPE_KEY" > /workspace/stripe-key.txt
        echo "Stripe key retrieved (length: $$(cat /workspace/stripe-key.txt | wc -c) chars)"
    waitFor: ['-']

  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        STRIPE_KEY=$$(cat /workspace/stripe-key.txt)
        # 修复：从 build-meta.env 读取构建版本信息（不依赖 .git）
        set -euo pipefail
        source /workspace/build-meta.env
        docker build \
          --no-cache \
          --build-arg NEXT_PUBLIC_API_URL=https://print-main-backend-651538279084.us-central1.run.app/api \
          --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$$STRIPE_KEY" \
          --build-arg NEXT_PUBLIC_BUILD_SHA="$$BUILD_SHA" \
          --build-arg NEXT_PUBLIC_BUILD_TIME="$$BUILD_TIME" \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/frontend:latest \
          -f apps/web/Dockerfile \
          . # 修复：构建上下文改为项目根目录，与Dockerfile匹配
    waitFor: ['read-stripe-key', 'compute-build-meta']

  # Push backend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/backend'
    waitFor: ['build-backend']

  # Push frontend image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/frontend'
    waitFor: ['build-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 修复：从 build-meta.env 读取构建版本信息（不依赖 .git）
        set -euo pipefail
        source /workspace/build-meta.env
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/backend:latest \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars NODE_ENV=production,AUTO_MIGRATE=true,FRONTEND_URL=https://print-main-frontend-651538279084.us-central1.run.app,GCP_IMAGE_BUCKET=print-main-product-images,GCP_IMAGE_BASE_URL=https://storage.googleapis.com/print-main-product-images,APP_BUILD_SHA=$$BUILD_SHA,APP_BUILD_TIME=$$BUILD_TIME \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --set-secrets DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest
    waitFor: ['push-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 修复：使用 bash 读取 build-meta.env，确保变量能在 gcloud 参数中展开
        set -euo pipefail
        source /workspace/build-meta.env
        gcloud run deploy ${_FRONTEND_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/frontend:latest \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars NODE_ENV=production,NEXT_PUBLIC_BUILD_SHA=$$BUILD_SHA,NEXT_PUBLIC_BUILD_TIME=$$BUILD_TIME \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --set-secrets NEXT_PUBLIC_API_URL=api-url:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=stripe-publishable-key:latest
    waitFor: ['push-frontend']

# Substitution variables (set via Cloud Build triggers or command line)
substitutions:
  _REGION: 'us-central1'                    # GCP region
  _ARTIFACT_REGISTRY: 'print-main'           # Artifact Registry repository name
  _BACKEND_SERVICE_NAME: 'print-main-backend'
  _FRONTEND_SERVICE_NAME: 'print-main-frontend'

# Build timeout (optional, in seconds)
timeout: '1200s'  # 20 minutes

# Build options
options:
  machineType: 'E2_HIGHCPU_8'  # Use 8-core machine for faster builds
  logging: CLOUD_LOGGING_ONLY

# Images to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/frontend:latest'

