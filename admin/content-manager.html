<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Content Manager | suvernire plus Admin</title>
	<link rel="stylesheet" href="../admin/admin.css">
	<link rel="stylesheet" href="../styles.css">
	<!-- [2025-11-02 22:13:00] Content Manager - Simple CMS for non-product images -->
</head>
<body class="admin-body">
	<header class="admin-header">
		<div class="container" style="display: flex; justify-content: space-between; align-items: center;">
			<h1>Content Manager</h1>
			<nav style="display: flex; gap: 16px;">
				<a href="index.html">Dashboard</a>
				<a href="content-manager.html" style="color: var(--color-primary); font-weight: 600;">Content</a>
				<a href="settings.html">Settings</a>
				<a href="../home.html" target="_blank">View Site</a>
			</nav>
		</div>
	</header>

	<main class="admin-main">
		<div class="container">

			<div class="content-manager">
				<!-- Hero Images Section -->
				<section class="content-section">
					<h2>Hero Section Images</h2>
					<p class="text-muted">Main hero cards displayed on homepage</p>
					
					<div class="image-grid" id="hero-images">
						<div class="image-item">
							<label>T-Shirt Card</label>
							<div class="image-preview" data-category="hero" data-key="tee">
								<div class="placeholder-preview">Preview</div>
								<input type="file" accept="image/*" class="image-input" data-category="hero" data-key="tee">
							</div>
							<div class="image-info">
								<input type="text" class="image-url" placeholder="/assets/hero/hero-card-tee.jpg" data-category="hero" data-key="tee">
								<button class="btn btn-sm" onclick="updateImage('hero', 'tee')">Update</button>
							</div>
						</div>

						<div class="image-item">
							<label>Water Bottle Card</label>
							<div class="image-preview" data-category="hero" data-key="bottle">
								<div class="placeholder-preview">Preview</div>
								<input type="file" accept="image/*" class="image-input" data-category="hero" data-key="bottle">
							</div>
							<div class="image-info">
								<input type="text" class="image-url" placeholder="/assets/hero/hero-card-bottle.jpg" data-category="hero" data-key="bottle">
								<button class="btn btn-sm" onclick="updateImage('hero', 'bottle')">Update</button>
							</div>
						</div>

						<div class="image-item">
							<label>Hat Card</label>
							<div class="image-preview" data-category="hero" data-key="hat">
								<div class="placeholder-preview">Preview</div>
								<input type="file" accept="image/*" class="image-input" data-category="hero" data-key="hat">
							</div>
							<div class="image-info">
								<input type="text" class="image-url" placeholder="/assets/hero/hero-card-hat.jpg" data-category="hero" data-key="hat">
								<button class="btn btn-sm" onclick="updateImage('hero', 'hat')">Update</button>
							</div>
						</div>

						<div class="image-item">
							<label>Tote Bag Card</label>
							<div class="image-preview" data-category="hero" data-key="bag">
								<div class="placeholder-preview">Preview</div>
								<input type="file" accept="image/*" class="image-input" data-category="hero" data-key="bag">
							</div>
							<div class="image-info">
								<input type="text" class="image-url" placeholder="/assets/hero/hero-card-bag.jpg" data-category="hero" data-key="bag">
								<button class="btn btn-sm" onclick="updateImage('hero', 'bag')">Update</button>
							</div>
						</div>
					</div>
				</section>

				<!-- Brand Logos Section -->
				<section class="content-section">
					<h2>Brand Logos</h2>
					<p class="text-muted">Brand logos displayed on homepage</p>
					
					<div class="image-grid" id="brand-logos">
						<!-- Will be populated by JavaScript -->
					</div>
				</section>

				<!-- Category Images Section -->
				<section class="content-section">
					<h2>Category Images</h2>
					<p class="text-muted">Product category images</p>
					
					<div class="image-grid" id="category-images">
						<!-- Will be populated by JavaScript -->
					</div>
				</section>

				<!-- Save Button -->
				<div class="content-actions">
					<button class="btn btn-primary" onclick="saveAllChanges()">Save All Changes</button>
					<button class="btn btn-outline" onclick="reloadConfig()">Reload Config</button>
				</div>
			</div>
		</div>
	</main>

	<script src="../scripts/content-manager.js"></script>
</body>
</html>
