name: Deploy Backend to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "prisma/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: print-482914
      REGION: us-central1
      SERVICE_NAME: print-main-backend
      IMAGE: us-central1-docker.pkg.dev/print-482914/print-main/backend:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_BUILD_SHA="${GITHUB_SHA::8}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${{ env.IMAGE }} \
            -f backend/Dockerfile \
            .

      - name: Push image to Artifact Registry
        run: docker push ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=0.5 \
            --concurrency=1 \
            --set-env-vars="NODE_ENV=production,AUTO_MIGRATE=true,FRONTEND_URL=https://printngoplus.com,GCP_IMAGE_BUCKET=print-482914-images,GCP_IMAGE_BASE_URL=https://storage.googleapis.com/print-482914-images,APP_BUILD_SHA=${GITHUB_SHA::8},APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --set-secrets="DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,OPENAI_API_KEY=openai-api-key:latest" \
            --quiet

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ 后端部署完成: $URL"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL/api/health" || echo "000")
          echo "健康检查 HTTP $STATUS"
