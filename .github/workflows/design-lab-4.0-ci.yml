name: Design Lab 4.0 CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/src/app/design-lab/**'
      - 'apps/web/src/config/**'
      - 'apps/web/src/lib/apiClient.ts'
      - 'apps/web/src/lib/stripe.ts'
      - 'apps/web/src/design/**'
      - 'apps/web/next.config.mjs'
      - 'scripts/check-env.mjs'
      - 'scripts/grep-hardcoded-urls.sh'
      - 'scripts/check-rsc-boundaries.mjs'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/app/design-lab/**'
      - 'apps/web/src/config/**'
      - 'apps/web/src/lib/apiClient.ts'
      - 'apps/web/src/lib/stripe.ts'
      - 'apps/web/src/design/**'
      - 'apps/web/next.config.mjs'
      - 'scripts/check-env.mjs'
      - 'scripts/grep-hardcoded-urls.sh'
      - 'scripts/check-rsc-boundaries.mjs'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      
      - name: Check environment variables
        run: node scripts/check-env.mjs
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_xxx
      
      - name: Check hardcoded URLs
        run: bash scripts/grep-hardcoded-urls.sh
      
      - name: Check RSC boundaries
        run: node scripts/check-rsc-boundaries.mjs
      
      - name: Run unit tests
        working-directory: apps/web
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_xxx
      
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_xxx
      
      - name: Run E2E tests
        working-directory: apps/web
        run: npm run test:e2e -- design-lab-4.0-init.spec.ts
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_xxx
        continue-on-error: true # E2E 测试可能需要在本地环境运行

