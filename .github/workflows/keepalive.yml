name: Keepalive — Cloud Run warm ping

on:
  schedule:
    - cron: '*/9 * * * *'   # every 9 minutes — keeps both services warm, avoids cold starts
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: print-482914
      REGION: us-central1

    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ping frontend and backend
        run: |
          FRONTEND_URL=$(gcloud run services describe print-main-frontend \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          BACKEND_URL=$(gcloud run services describe print-main-backend \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "Pinging frontend: $FRONTEND_URL"
          curl -sf -o /dev/null -w "Frontend HTTP %{http_code} — %{time_total}s\n" "$FRONTEND_URL" \
            || echo "⚠️ Frontend ping failed (may be deploying)"

          echo "Pinging backend: $BACKEND_URL"
          curl -sf -o /dev/null -w "Backend  HTTP %{http_code} — %{time_total}s\n" "$BACKEND_URL/api/health" \
            || echo "⚠️ Backend ping failed (may be deploying)"
