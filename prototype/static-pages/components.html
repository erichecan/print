<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UI Components Showcase | suvernire plus</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<script src="ui-components.js" defer></script>
</head>
<body>
	<header class="primary" role="banner">
		<div class="container">
			<nav class="nav" aria-label="Primary Navigation">
				<div class="brand">
					<a href="home.html" style="display:flex;align-items:center;gap:10px">
						<div class="brand__logo" aria-hidden="true"></div>
						<span class="brand__name">suvernire plus</span>
					</a>
				</div>
				<div class="menu" role="menubar">
					<a role="menuitem" href="home.html">Home</a>
					<a role="menuitem" href="components.html">Components</a>
				</div>
				<div class="cta">
					<a class="btn" href="home.html">Back to Site</a>
				</div>
			</nav>
		</div>
	</header>

	<main style="padding: 48px 0;">
		<div class="container">
			<h1 style="margin-bottom: 48px;">UI Components Showcase</h1>
			
			<!-- Buttons -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Buttons</h2>
				<div style="display: flex; flex-wrap: wrap; gap: 16px;">
					<button class="btn" data-loading>Primary Button</button>
					<button class="btn btn--outline">Outline Button</button>
					<button class="btn" data-confirm="Are you sure you want to do this?">Confirm Dialog</button>
				</div>
			</section>

			<!-- Toasts -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Toast Notifications</h2>
				<div style="display: flex; flex-wrap: wrap; gap: 16px;">
					<button class="btn" onclick="UI.showToast('Operation successful!', 'success')">Success Toast</button>
					<button class="btn btn--outline" onclick="UI.showToast('An error occurred', 'error')">Error Toast</button>
					<button class="btn btn--outline" onclick="UI.showToast('Please be careful', 'warning')">Warning Toast</button>
					<button class="btn btn--outline" onclick="UI.showToast('Information message', 'info')">Info Toast</button>
				</div>
			</section>

			<!-- Modals -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Modals</h2>
				<div style="display: flex; flex-wrap: wrap; gap: 16px;">
					<button class="btn" onclick="UI.showConfirm('Are you sure you want to delete this item?', () => UI.showToast('Item deleted', 'success'))">
						Confirmation Modal
					</button>
					<button class="btn btn--outline" onclick="UI.showAlert('This is a success message!', 'success')">
						Success Alert
					</button>
					<button class="btn btn--outline" onclick="UI.showAlert('This is an error message', 'error')">
						Error Alert
					</button>
				</div>
			</section>

			<!-- Empty States -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Empty States</h2>
				<div class="card" style="padding: 32px; min-height: 300px;">
					<div id="empty-state-demo"></div>
				</div>
				<div style="margin-top: 16px;">
					<button class="btn" onclick="renderEmptyStates()">Show Different Empty States</button>
				</div>
			</section>

			<!-- Skeletons -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Loading Skeletons</h2>
				<div class="card" style="padding: 32px;">
					<div id="skeleton-demo"></div>
				</div>
				<div style="margin-top: 16px;">
					<button class="btn" onclick="renderSkeletons()">Show Different Skeletons</button>
				</div>
			</section>

			<!-- Form Validation -->
			<section style="margin-bottom: 64px;">
				<h2 style="margin-bottom: 24px;">Form Validation</h2>
				<form class="card" style="padding: 32px; max-width: 500px;" onsubmit="return validateFormDemo(event)">
					<div class="tool-row">
						<label for="demo-email">Email *</label>
						<input id="demo-email" type="email" required>
					</div>
					<div class="tool-row">
						<label for="demo-name">Name *</label>
						<input id="demo-name" type="text" required>
					</div>
					<div class="tool-row">
						<label for="demo-phone">Phone</label>
						<input id="demo-phone" type="tel">
					</div>
					<button type="submit" class="btn">Submit Form</button>
				</form>
			</section>
		</div>
	</main>

	<script>
		let emptyStateIndex = 0;
		const emptyStates = [
			{ icon: '🛒', title: 'Your cart is empty', message: 'Add some products to get started!' },
			{ icon: '📦', title: 'No orders yet', message: 'Your order history will appear here.' },
			{ icon: '🎨', title: 'No saved designs', message: 'Create your first custom design!' },
			{ icon: '🔍', title: 'No results found', message: 'Try adjusting your search terms.' }
		];

		function renderEmptyStates() {
			const state = emptyStates[emptyStateIndex % emptyStates.length];
			UI.showEmptyState(document.getElementById('empty-state-demo'), state);
			emptyStateIndex++;
		}

		let skeletonIndex = 0;
		const skeletonTypes = ['product', 'list', 'card'];

		function renderSkeletons() {
			const type = skeletonTypes[skeletonIndex % skeletonTypes.length];
			UI.showSkeleton(document.getElementById('skeleton-demo'), type);
			skeletonIndex++;
		}

		function validateFormDemo(event) {
			event.preventDefault();
			const isValid = UI.validateForm(event.target);
			if (isValid) {
				UI.showToast('Form submitted successfully!', 'success');
			} else {
				UI.showToast('Please fix the errors and try again', 'error');
			}
			return false;
		}

		// Initial render
		renderEmptyStates();
		renderSkeletons();
	</script>
</body>
</html>
