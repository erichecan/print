<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reset Password | suvernire plus</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<!-- [2025-11-01 00:00:00] Forgot password / password reset page -->
</head>
<body class="ndx-body">
	<main class="ndx" aria-labelledby="reset-title">
		<div class="ndx__card">
			<section class="ndx__left placeholder" aria-hidden="true"></section>
			<section class="ndx__right">
				<h1 id="reset-title">Reset Your Password</h1>
				<p class="ndx__subtitle">Enter your email and we'll send you a link to reset your password.</p>

				<form class="ndx__form" novalidate>
					<label for="email">Email</label>
					<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

					<div class="ndx__actions">
						<button class="btn btn--outline" type="button" onclick="window.location.href='ndx-welcome.html'">Cancel</button>
						<button class="btn" type="submit" id="send-reset">Send Reset Link</button>
					</div>

					<div id="success-message" style="display: none; padding: 12px; background: rgba(255,31,61,0.08); border-radius: 8px; color: var(--color-primary-700);">
						<strong>Email sent!</strong> Check your inbox for the reset link.
					</div>

					<p class="ndx__help">Remember your password? <a href="ndx-welcome.html" style="color: var(--color-primary);">Sign in</a></p>
				</form>
			</section>
		</div>
	</main>

	<script>
		(function(){
			const form = document.querySelector('.ndx__form');
			const btn = document.getElementById('send-reset');
			const msg = document.getElementById('success-message');
			form.addEventListener('submit', function(e){
				e.preventDefault();
				const email = document.getElementById('email');
				if(!email.value){
					email.focus();
					return;
				}
				btn.disabled = true;
				btn.textContent = 'Sending...';
				setTimeout(function(){
					msg.style.display = 'block';
					btn.style.display = 'none';
				}, 1500);
			});
		})();
	</script>
</body>
</html>
