# Netlify Configuration (Root Level)
# Alternative configuration at root level
# 合并 Netlify 配置，仅保留根目录版本供部署使用
# 
# 如果 apps/web/netlify.toml 不工作，可以使用这个根目录的配置
# 在 Netlify 控制台：
# - Base directory: （留空）
# - Build command: （留空，使用此配置）
# - Publish directory: （留空，使用此配置）

[build]
  # 直接在 apps/web 子目录构建，简化插件配置
  base = "apps/web"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  # Node.js 版本
  NODE_VERSION = "18"
  # 禁用 Next.js 遥测
  NEXT_TELEMETRY_DISABLED = "1"
  # 设置 CI 环境变量以避免构建警告导致失败
  CI = "false"
  # 后端 API URL（如果 Netlify Dashboard 中无法设置，可以在这里设置）
  # 注意：如果 Dashboard 中已设置，Dashboard 的优先级更高
  # NEXT_PUBLIC_API_URL = "https://print-mnmz.onrender.com/api"

# 启用 Netlify 官方 Next.js 插件以支持 SSR
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 静态资源缓存配置
[[headers]]
  for = "/assets/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

