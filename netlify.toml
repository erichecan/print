# Netlify Configuration (Root Level)
# [2025-01-27 12:30:00] Alternative configuration at root level
# 
# 如果 apps/web/netlify.toml 不工作，可以使用这个根目录的配置
# 在 Netlify 控制台：
# - Base directory: （留空）
# - Build command: （留空，使用此配置）
# - Publish directory: （留空，使用此配置）

[build]
  # [2025-11-14 06:22:00] 改用 Netlify Next.js 插件，先安装根依赖再构建子应用
  command = "npm install && cd apps/web && npm install && npm run build"
  # [2025-11-14 06:22:00] SSR 模式下由插件接管 .next 输出
  publish = "apps/web/.next"

[build.environment]
  # Node.js 版本
  NODE_VERSION = "18"
  # 禁用 Next.js 遥测
  NEXT_TELEMETRY_DISABLED = "1"
  # 设置 CI 环境变量以避免构建警告导致失败
  CI = "false"

# [2025-11-14 06:22:00] 启用 Netlify 官方 Next.js 插件以支持 SSR
[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    base = "apps/web"

